; Alembic configuration for ApplicantOS.
;
; There is deliberately NO `sqlalchemy.url` here. The database URL is runtime configuration
; that lives in exactly one place -- `app.config.settings.Settings.database_url`, sourced
; from the environment and `.env` -- and `alembic/env.py` reads it from there. Duplicating a
; connection string into a checked-in ini file is how a migration ends up run against the
; wrong database, and how credentials end up in version control.
;
; Revision identifiers are sequential zero-padded integers (`0001`, `0002`, ...) rather than
; random hashes, and `file_template` puts that identifier first, so `ls alembic/versions`
; reads in migration order:
;
;     alembic revision --rev-id 0002 -m "add resume variants"   ->  0002_add_resume_variants.py
;
; A hash prefix would sort the directory arbitrarily, and the ordering that actually matters
; (the `down_revision` chain) would be invisible from the filesystem.

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

; Revision slugs are truncated to keep filenames workable on every platform, including
; Windows, where the total path length is bounded.
truncate_slug_length = 48

; Timestamps are rendered as timezone-aware UTC, matching every datetime in the schema
; (`app.database.types.UTCDateTime`). Leaving this blank would use naive local time.
timezone = UTC

; Recursive version locations are off: this project keeps one linear history in
; alembic/versions, and branching would defeat the sequential numbering above.
recursive_version_locations = false

; NOTE: no `sqlalchemy.*` keys belong in this section beyond the URL that env.py injects.
; Everything prefixed `sqlalchemy.` is forwarded verbatim to `create_engine()` by
; `(async_)engine_from_config`, so a stray option here becomes a TypeError at connect time.


; ---------------------------------------------------------------------------------------
; Logging
;
; These loggers configure the *alembic CLI only*. The application's own structlog pipeline
; (`app.config.logging`) is unaffected: env.py does not call `logging.config.fileConfig`
; unconditionally, so importing the app from a migration cannot have its logging
; reconfigured out from under it.
; ---------------------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
