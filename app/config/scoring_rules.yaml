      - "embedded development"
      - "embedded"
      - "bare metal"
      - "bare-metal"
      - "microcontroller"
      - "system on chip"
      - "system-on-chip"
    all_of: []
    none_of: []
    regex: null

  - key: "robotics"
    label: "Robotics domain"
    points: 30
    field: "text"
