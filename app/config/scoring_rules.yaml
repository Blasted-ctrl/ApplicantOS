  - key: "requires_senior_experience"
    label: "Requires 8+ years of experience"
    points: -20
    field: "text"
    any_of: []
    all_of: []
    none_of: []
    regex: '\b(?:[89]|[1-9][0-9])\s*\+?\s*(?:years|yrs)\b'

  - key: "sponsorship_unavailable"
    label: "Visa sponsorship explicitly unavailable"
    points: -40
