      - "new graduate"
      - "recent graduate"
      - "entry level"
      - "entry-level"
      - "early career"
      - "university graduate"
      - "campus hire"
      - "grad program"
      - "0-2 years"
      - "0-1 years"
      - "1-2 years"
    all_of: []
    none_of: []
