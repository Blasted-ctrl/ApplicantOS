# =====================================================================================
# ApplicantOS — scoring rule pack
# =====================================================================================
#
# Consumed by `app/ai/scoring.py` (`DEFAULT_RULES`, `load_rules()`). Rule evaluation is
# pure, synchronous and deterministic: the same posting always produces the same total.
# The optional LLM pass may adjust the total by at most +/-10 and may never flip a hard
# negative (sponsorship unavailable, blocked company, blocked industry) into "apply".
#
# -------------------------------------------------------------------------------------
# Per-rule schema (every key is always present; unused list keys are `[]`, unused
# scalars are `null`):
#
#   key      str            stable identifier, unique within the pack, snake_case
#   label    str            human-readable explanation shown in the score breakdown
#   points   int            signed contribution added to the total when the rule fires
#   field    str            which haystack to match against (see "fields" below)
#   any_of   list[str]      fires when AT LEAST ONE substring is present
#   all_of   list[str]      requires EVERY substring to be present
#   none_of  list[str]      suppresses the rule when ANY substring is present
#   regex    str | null     additional case-insensitive pattern that must match
#
# Combination semantics are a plain conjunction. A rule fires when all of:
#   (any_of is empty OR at least one entry matches)
#   AND (all_of is empty OR every entry matches)
#   AND (none_of is empty OR no entry matches)
#   AND (regex is null OR the pattern matches)
# All substring matching is case-insensitive against the lowercased haystack.
#
# -------------------------------------------------------------------------------------
# Field vocabulary:
#
#   text              title + description + company name + location, joined and lowercased
#                     (the default haystack; use it unless a narrower field is safer)
#   title             posting title only — use for title-shaped signals to avoid false
#                     positives from the body text
#   description       posting body only
#   company           company display name
#   location          posting location string
#   work_arrangement  WorkArrangement enum value: remote | hybrid | onsite | unknown
#   employment_type   EmploymentType enum value: full_time | part_time | internship |
#                     contract | new_grad | unknown
#
# -------------------------------------------------------------------------------------
# WHO THIS PACK IS FOR
#
# A software engineering **intern** searching in **Michigan or remote**, who is a **US
# citizen** and therefore needs no visa sponsorship.
#
# Three consequences shape every number below, and each replaced something that was
# actively wrong for this search:
#
# 0. **Two gates, not one.** `not_an_internship` (-60) and `not_software_engineering`
#    (-50) both fire on the *title*, and together they are what make this a search rather
#    than a ranking. Gating only on intern-ness put "Graphic Design, Video & Motion
#    Graphics Intern" and "Human Resources Intern" at a normalised 100 with verdict
#    `apply` — they are genuinely internships, genuinely remote, and their bodies mention
#    enough tooling to stack points. An auto-apply run would have applied to them.
#
# 1. **Internship is the axis, not a bonus.** A posting's intern-ness outweighs any single
#    technology match, because a perfect Python role that wants six years of experience is
#    not a near-miss — it is unreachable. `internship_title` is the largest positive in the
#    pack and the seniority penalties are the largest negatives.
#
# 2. **No salary floor.** Internships are paid hourly or monthly ("$25/hour",
#    "$4,800/month") and very often post no figure at all. A $60,000 floor rule read those
#    as underpaid and subtracted from exactly the postings this search exists to find.
#
# 3. **Sponsorship is not a signal.** For a US citizen, "we cannot sponsor" says nothing
#    about fit — a -40 rule on it was subtracting from every posting that merely mentioned
#    visas. It is now -2, kept only so the engine's veto path stays wired for anyone who
#    edits their profile to need sponsorship.
#
# Location is scored rather than merely filtered, because discovery's location filter is a
# substring match that has to be wide enough to catch "Remote - US" and every spelling of
# Michigan. Anything that slips through is corrected here.
#
# -------------------------------------------------------------------------------------
# CANONICAL WORKED EXAMPLE — this pack must reproduce it exactly.
#
# A fully remote software engineering internship for summer, written in Python with
# React, deployed on AWS, at an employer that states it cannot sponsor visas:
#
#     internship_title              +45
#     software_engineering_title    +30
#     remote                        +25
#     structured_program            +10
#     python                        +10
#     summer_season                  +8
#     web_frameworks                 +8
#     cloud_platform                 +8
#     sponsorship_unavailable        -2
#     -------------------------------
#     TOTAL                         142   (normalised to 100)
#
# `sponsorship_unavailable` deliberately contributes almost nothing to that total. The
# employer in the example states it cannot sponsor, and for a US citizen that is not a
# fact about fit — it was a -40 rule subtracting from every posting that mentioned visas
# at all. It survives at -2 only so the engine's veto path stays wired for anyone who
# edits their profile to need sponsorship, at which point it becomes a hard negative
# regardless of these points.
#
# `tests/test_scoring.py` asserts this total. Do not change these nine rules without
# updating that test in the same commit.
# =====================================================================================

version: 1
name: swe-internship-michigan-remote
description: >-
  Software engineering internships in Michigan or fully remote, for a US citizen who
  needs no visa sponsorship. Internship signals and location dominate; seniority,
  experience requirements and unpaid work are the hard negatives. There is deliberately
  no compensation floor — internship pay is hourly or monthly and frequently unposted.

rules:
  # ===================================================================================
  # The internship axis — the largest positives in the pack
  # ===================================================================================

  - key: "internship_title"
    label: "Internship or co-op"
    points: 45
    field: "title"
    any_of: []
    all_of: []
    none_of: []
    regex: '\b(?:intern|interns|internship|internships|co-?op)\b'

  - key: "internship_employment_type"
    label: "Typed as an internship by the employer"
    points: 15
    field: "employment_type"
    any_of:
      - "internship"
    all_of: []
    none_of: []
    regex: null

  - key: "summer_season"
    label: "Summer or seasonal cohort"
    points: 8
    field: "text"
    any_of: []
    all_of: []
    none_of: []
    regex: '\b(?:summer|fall|winter|spring)\s*20\d{2}\b'

  - key: "student_or_entry_level"
    label: "Open to students and entry level"
    points: 10
    field: "text"
    any_of:
      - "currently enrolled"
      - "pursuing a bachelor"
      - "pursuing a degree"
      - "undergraduate"
      - "rising junior"
      - "rising senior"
      - "entry level"
      - "entry-level"
      - "new grad"
      - "new graduate"
      - "university program"
      - "campus hire"
    all_of: []
    none_of: []
    regex: null

  - key: "structured_program"
    label: "Structured internship or rotational programme"
    points: 10
    field: "text"
    any_of:
      - "internship program"
      - "intern program"
      - "rotational program"
      - "cohort"
      - "mentorship"
      - "mentor"
    all_of: []
    none_of: []
    regex: null

  # ===================================================================================
  # Software engineering — what the role actually is
  # ===================================================================================

  - key: "software_engineering_title"
    label: "Software engineering role"
    points: 30
    field: "title"
    any_of: []
    all_of: []
    none_of: []
    regex: '\b(?:software\s+(?:engineer|engineering|developer|development)|swe|programmer)\b'

  - key: "engineering_discipline"
    label: "Engineering discipline named in the body"
    points: 8
    field: "description"
    any_of:
      - "software engineer"
      - "software development"
      - "software engineering"
      - "computer science"
    all_of: []
    none_of: []
    regex: null

  - key: "backend"
    label: "Backend engineering"
    points: 12
    field: "text"
    any_of:
      - "backend"
      - "back-end"
      - "back end"
      - "server-side"
      - "server side"
    all_of: []
    none_of: []
    regex: null

  - key: "frontend"
    label: "Frontend engineering"
    points: 10
    field: "text"
    any_of:
      - "frontend"
      - "front-end"
      - "front end"
      - "user interface"
    all_of: []
    none_of: []
    regex: null

  - key: "fullstack"
    label: "Full-stack engineering"
    points: 12
    field: "text"
    any_of:
      - "full stack"
      - "full-stack"
      - "fullstack"
    all_of: []
    none_of: []
    regex: null

  - key: "distributed_systems"
    label: "Distributed systems and scale"
    points: 8
    field: "text"
    any_of:
      - "distributed systems"
      - "microservices"
      - "high availability"
      - "scalability"
      - "concurrency"
    all_of: []
    none_of: []
    regex: null

  - key: "data_structures_algorithms"
    label: "Data structures and algorithms"
    points: 6
    field: "text"
    any_of:
      - "data structures"
      - "algorithms"
      - "problem solving"
      - "problem-solving"
    all_of: []
    none_of: []
    regex: null

  # ===================================================================================
  # Languages and tooling
  # ===================================================================================

  - key: "python"
    label: "Python"
    points: 10
    field: "text"
    any_of:
      - "python"
    all_of: []
    none_of: []
    regex: null

  - key: "java"
    label: "Java"
    points: 10
    field: "text"
    any_of: []
    all_of: []
    none_of: []
    regex: '\bjava\b(?!script)'

  - key: "javascript_typescript"
    label: "JavaScript or TypeScript"
    points: 10
    field: "text"
    any_of:
      - "javascript"
      - "typescript"
    all_of: []
    none_of: []
    regex: null

  - key: "cpp"
    label: "C or C++"
    points: 8
    field: "text"
    any_of:
      - "c++"
    all_of: []
    none_of: []
    regex: null

  - key: "golang"
    label: "Go"
    points: 8
    field: "text"
    any_of:
      - "golang"
    all_of: []
    none_of: []
    regex: null

  - key: "csharp_dotnet"
    label: "C# or .NET"
    points: 6
    field: "text"
    any_of:
      - "c#"
      - ".net"
    all_of: []
    none_of: []
    regex: null

  - key: "web_frameworks"
    label: "Common web frameworks"
    points: 8
    field: "text"
    any_of:
      - "react"
      - "node.js"
      - "nodejs"
      - "django"
      - "flask"
      - "spring boot"
      - "next.js"
      - "angular"
      - "vue"
    all_of: []
    none_of: []
    regex: null

  - key: "cloud_platform"
    label: "Cloud platform"
    points: 8
    field: "text"
    any_of:
      - "aws"
      - "amazon web services"
      - "gcp"
      - "google cloud"
      - "azure"
    all_of: []
    none_of: []
    regex: null

  - key: "containers_and_ci"
    label: "Containers and CI/CD"
    points: 6
    field: "text"
    any_of:
      - "docker"
      - "kubernetes"
      - "ci/cd"
      - "continuous integration"
      - "terraform"
    all_of: []
    none_of: []
    regex: null

  - key: "databases"
    label: "Databases and SQL"
    points: 6
    field: "text"
    any_of:
      - "sql"
      - "postgres"
      - "postgresql"
      - "mysql"
      - "mongodb"
      - "redis"
    all_of: []
    none_of: []
    regex: null

  - key: "version_control_and_testing"
    label: "Version control and testing practice"
    points: 4
    field: "text"
    any_of:
      - "git"
      - "unit test"
      - "unit testing"
      - "code review"
    all_of: []
    none_of: []
    regex: null

  - key: "machine_learning"
    label: "Machine learning or data"
    points: 6
    field: "text"
    any_of:
      - "machine learning"
      - "deep learning"
      - "pytorch"
      - "tensorflow"
      - "data science"
    all_of: []
    none_of: []
    regex: null

  # ===================================================================================
  # Location — Michigan or remote, scored as well as filtered
  # ===================================================================================

  - key: "location_michigan"
    label: "In Michigan"
    points: 25
    field: "location"
    any_of:
      - "michigan"
      - ", mi"
      - "ann arbor"
      - "detroit"
      - "dearborn"
      - "grand rapids"
      - "lansing"
      - "troy, "
      - "warren, "
      - "southfield"
      - "auburn hills"
    all_of: []
    none_of: []
    regex: null

  - key: "remote"
    label: "Fully remote"
    points: 25
    field: "work_arrangement"
    any_of:
      - "remote"
    all_of: []
    none_of: []
    regex: null

  - key: "remote_outside_the_us"
    label: "Remote, but not in the United States"
    points: -30
    field: "location"
    any_of:
      - "poland"
      - "india"
      - "canada"
      - "emea"
      - "apac"
      - "asia"
      - "united kingdom"
      - "germany"
      - "ireland"
      - "brazil"
      - "mexico"
      - "singapore"
      - "australia"
      - "bangalore"
      - "europe"
      - "spain"
      - "portugal"
      - "france"
      - "netherlands"
      - "sweden"
      - "switzerland"
      - "japan"
      - "korea"
      - "hong kong"
      - "taiwan"
      - "philippines"
      - "vietnam"
      - "indonesia"
      - "israel"
      - "dubai"
      - "united arab emirates"
      - "nigeria"
      - "kenya"
      - "south africa"
      - "argentina"
      - "colombia"
      - "chile"
      - "costa rica"
      - "romania"
      - "ukraine"
      - "türkiye"
      - "turkey"
    all_of: []
    none_of: []
    regex: null

  - key: "onsite_far_from_michigan"
    label: "On-site, and not in Michigan"
    points: -15
    field: "work_arrangement"
    any_of:
      - "onsite"
    all_of: []
    none_of: []
    regex: null

  - key: "hybrid_arrangement"
    label: "Hybrid arrangement"
    points: -5
    field: "work_arrangement"
    any_of:
      - "hybrid"
    all_of: []
    none_of: []
    regex: null

  # ===================================================================================
  # Hard negatives — the reasons an internship search must skip a posting
  # ===================================================================================

  - key: "not_software_engineering"
    label: "Not a software engineering role"
    points: -50
    field: "title"
    any_of: []
    all_of: []
    # Every term here must be unambiguously about building software. Bare "development"
    # was not: it cleared "Policy Development & Support Intern" to a normalised 95, and
    # would equally clear Business, Fund and Talent Development. "technical" and
    # "technology" went the same way — "Technical Writer Intern" is not this search.
    none_of:
      - "software"
      - "engineer"
      - "developer"
      - "software development"
      - "web development"
      - "application development"
      - "swe"
      - "programmer"
      - "computer science"
      - "data scien"
      - "machine learning"
      - "coding"
      - "full stack"
      - "fullstack"
      - "backend"
      - "frontend"
      - "devops"
      - "site reliability"
    regex: null

  - key: "not_an_internship"
    label: "Not an internship or co-op"
    points: -60
    field: "title"
    any_of: []
    all_of: []
    none_of:
      - "intern"
      - "co-op"
      - "coop"
    regex: null

  - key: "senior_title_mismatch"
    label: "Seniority above intern level"
    points: -35
    field: "title"
    any_of: []
    all_of: []
    none_of:
      - "intern"
    regex: '\b(?:senior|sr\.?|staff|principal|lead|manager|director|head\s+of|architect|vp|president)\b'

  - key: "requires_professional_experience"
    label: "Requires years of professional experience"
    points: -30
    field: "text"
    any_of: []
    all_of: []
    none_of: []
    regex: '\b(?:[3-9]|1[0-9])\+?\s*(?:\+|or\s+more)?\s*years?\b'

  - key: "phd_required"
    label: "Doctorate required"
    points: -25
    field: "text"
    any_of:
      - "phd required"
      - "ph.d. required"
      - "doctorate required"
      - "must have a phd"
    all_of: []
    none_of: []
    regex: null

  - key: "security_clearance_required"
    label: "Active security clearance required"
    points: -35
    field: "text"
    any_of:
      - "security clearance"
      - "ts/sci"
      - "top secret"
      - "secret clearance"
      - "polygraph"
    all_of: []
    none_of: []
    regex: null

  - key: "unpaid_or_commission"
    label: "Unpaid, equity-only, or commission-only"
    points: -50
    field: "text"
    any_of:
      - "unpaid internship"
      - "unpaid"
      - "equity only"
      - "equity-only"
      - "commission only"
      - "commission-only"
      - "for credit only"
    all_of: []
    none_of: []
    regex: null

  - key: "staffing_agency"
    label: "Staffing agency or third-party recruiter listing"
    points: -18
    field: "text"
    any_of:
      - "staffing agency"
      - "recruiting agency"
      - "our client is"
      - "on behalf of our client"
      - "c2c"
      - "corp to corp"
    all_of: []
    none_of: []
    regex: null

  - key: "not_engineering"
    label: "Not a software engineering role"
    points: -25
    field: "title"
    any_of: []
    all_of: []
    none_of:
      - "engineer"
      - "developer"
      - "software"
    regex: '\b(?:sales|account\s+executive|recruiter|marketing|customer\s+success|business\s+development|operations|finance|accounting|paralegal|nurse|driver|technician)\b'

  # ===================================================================================
  # Weak positives kept for ranking, not for gating
  # ===================================================================================

  - key: "sponsorship_unavailable"
    label: "Visa sponsorship explicitly unavailable"
    points: -2
    field: "text"
    any_of:
      - "cannot sponsor"
      - "unable to sponsor"
      - "not able to sponsor"
      - "no sponsorship"
      - "without sponsorship"
      - "do not sponsor"
      - "does not sponsor"
    all_of: []
    none_of: []
    regex: null

  - key: "sponsorship_friendly"
    label: "Employer sponsors work visas"
    points: 3
    field: "text"
    any_of:
      - "will sponsor"
      - "sponsorship available"
      - "visa sponsorship provided"
    all_of: []
    none_of: []
    regex: null

  - key: "large_employer_program"
    label: "Named early-career programme"
    points: 5
    field: "text"
    any_of:
      - "early career"
      - "early-career"
      - "university recruiting"
      - "campus recruiting"
    all_of: []
    none_of: []
    regex: null
