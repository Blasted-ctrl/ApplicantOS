      - "manipulator"
      - "mobile robot"
      - "drone"
      - "uav"
    all_of: []
    none_of: []
    regex: null

  - key: "firmware"
    label: "Firmware engineering"
    points: 25
    field: "text"
    any_of:
      - "firmware"
      - "bootloader"
      - "device driver"
      - "board support package"
