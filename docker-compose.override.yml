# Development overrides — read automatically by `docker compose up`.
#
# Compose merges this on top of `docker-compose.yml` unless you ask it not to:
#
#     docker compose up -d                          # dev: this file is applied
#     docker compose -f docker-compose.yml up -d    # production-shaped: it is not
#
# Three things change, and each one is a deliberate trade of safety or speed:
#
#   1. **Bind-mounted source.** `/app` becomes the working tree, so an edit is live. Both
#      images install the project editable precisely so this works without a rebuild.
#   2. **`--reload`.** uvicorn watches the tree; Celery does not have a reloader, so the
#      workers still need `docker compose restart worker-*` after a change to a task.
#   3. **A headed browser, on request.** `PLAYWRIGHT_HEADLESS=false` is how you watch an
#      application being filled in — but a container has no display, so it needs one
#      forwarded. See the note on `worker-apply` below.
#
# What does NOT change: the kill switch. AUTO_APPLY_ENABLED and DRY_RUN keep the values from
# the base file, which are the safe ones. A development override that quietly enabled real
# submissions is exactly the accident golden rule #3 exists to prevent.

# The bind mount that makes the source live. Two entries, not one: `/app` maps to the tree,
# and `/app/var` is re-declared as the named volume so the container's runtime state does not
# land in the developer's working copy (where `.gitignore` already excludes it, and where the
# API and the workers would otherwise fight over file ownership with the host user).
x-source-mount: &source-mount
  - .:/app
  - appdata:/app/var
  # An editable install writes an `__editable__*.pth` into site-packages, which lives in the
  # image, not in the mount — so the mount does not break the install. The egg-info directory
  # it points at is regenerated by the bind mount and is intentionally not masked.

x-dev-env: &dev-env
  DEBUG: "true"
  # Human-readable console rendering instead of JSON. `redact_secrets` stays in the
  # processor chain either way — golden rule #4 is not a formatting concern.
  LOG_JSON: "false"
  LOG_LEVEL: ${LOG_LEVEL:-DEBUG}


services:

  api:
    environment:
      <<: *dev-env
    volumes: *source-mount
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      # Watch only the backend package. Reloading on a change under `var/` would restart the
      # API every time a worker wrote a screenshot.
      - --reload-dir
      - /app/app
    # `--reload` restarts the process on every save, and the image's healthcheck would flap
    # unhealthy through each restart, taking Prometheus's `depends_on` with it.
    healthcheck:
      disable: true

  migrate:
    volumes: *source-mount

  worker-discovery:
    environment:
      <<: *dev-env
    volumes: *source-mount

  worker-ai:
    environment:
      <<: *dev-env
    volumes: *source-mount

  worker-apply:
    environment:
      <<: *dev-env
      # THE HEADED-BROWSER TOGGLE.
      #
      #     PLAYWRIGHT_HEADLESS=false DISPLAY=host.docker.internal:0 docker compose up worker-apply
      #
      # A container has no display of its own, so `false` alone gets you
      # "Missing X server or $DISPLAY". Two ways to give it one:
      #
      #   * an X server on the host (VcXsrv/X410 on Windows, XQuartz on macOS, native on
      #     Linux) plus DISPLAY as above — on Linux also mount /tmp/.X11-unix;
      #   * or, better for debugging a form, leave it headless and read the artefacts:
      #     every step writes a screenshot under SCREENSHOT_DIR and the trace lands in
      #     DATA_DIR, both inside the `appdata` volume.
      #
      # PLAYWRIGHT_SLOW_MO_MS makes a headed run followable; it is 0 in the base file
      # because a 250ms pause per interaction against a real ATS reads as automation.
      PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-true}
      PLAYWRIGHT_SLOW_MO_MS: ${PLAYWRIGHT_SLOW_MO_MS:-0}
      DISPLAY: ${DISPLAY:-}
    volumes: *source-mount

  worker-knowledge:
    environment:
      <<: *dev-env
    volumes: *source-mount

  beat:
    environment:
      <<: *dev-env
    volumes: *source-mount
