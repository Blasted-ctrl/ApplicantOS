# ApplicantOS — packaging and dependency manifest.
#
# Everything the backend needs to *import* lives in `[project].dependencies`. Everything it
# only needs in a particular deployment shape — a database driver, an optional accelerator —
# is an extra, so a fresh clone can install exactly the stack it is going to run.
#
# Two install shapes are supported and both are named here:
#
#   pip install -e ".[postgres]"   # the default posture: DATABASE_URL is postgresql+asyncpg
#   pip install -e ".[sqlite]"     # SQLITE_MODE=true, the zero-infrastructure install
#
# `app/database/session.py` builds the engine at import time from `settings.database_url`,
# so the driver named by that URL must be installed before anything under `app.database`
# can even be imported. That is why the drivers are extras rather than hard dependencies:
# they are not optional at runtime, they are *chosen* at install time.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "applicantos"
version = "0.1.0"
description = "Knowledge-graph-driven job application automation with a hard kill switch."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"

# Runtime imports, all of them. See docs/CONTRACTS.md §1-§4 for what each one carries:
#   sqlalchemy       — the ORM; >=2.0 is mandatory because every model uses `Mapped[]`
#                      declarative syntax, which does not exist in 1.4.
#   pydantic         — v2 only: `model_validator(mode="after")`, `model_fields`.
#   pydantic-settings— `BaseSettings` / `SettingsConfigDict`, split out of pydantic in v2.
#   structlog        — the logging pipeline, including the `redact_secrets` processor
#                      that golden rule #4 makes non-negotiable.
#   alembic          — schema migrations; `alembic/env.py` imports `app.models`.
dependencies = [
    "SQLAlchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "alembic>=1.13",
]

[project.optional-dependencies]
# Database drivers. `asyncpg` serves `database_url`; `psycopg` serves the derived
# `sync_database_url` that Alembic and blocking tooling run on (see
# `ASYNC_TO_SYNC_DRIVERS` in app/config/settings.py). Both are needed for a Postgres install.
postgres = [
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
]
# `sqlite_mode` rewrites the URL to sqlite+aiosqlite; the sync half (`sqlite+pysqlite`) is
# stdlib, so only the async driver has to be installed.
sqlite = [
    "aiosqlite>=0.19",
]

# Optional accelerators. Each import site degrades gracefully when the package is absent:
#   orjson  — app/cache/base.py falls back to the stdlib json codec (wire-compatible).
#   redis   — app/cache/redis_cache.py marks itself unavailable and logs once.
#   pgvector— app/database/types.py stores embeddings as JSON instead of a native vector.
redis = ["redis>=5.0"]
orjson = ["orjson>=3.9"]
pgvector = ["pgvector>=0.2"]

# Convenience aggregates.
sqlite-all = ["applicantos[sqlite,orjson]"]
postgres-all = ["applicantos[postgres,redis,orjson,pgvector]"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["config/*.yaml"]

# ──────────────────────────────────────────────────────────────────────────────
# Lint / type / test configuration
# ──────────────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions", ".venv", "desktop"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    # FastAPI's entire dependency system is function calls in argument defaults.
    # Rewriting Depends()/Body()/Query() into module singletons would obscure every
    # route signature to satisfy a rule written for a different framework.
    "B008",
    # Typeshed-oriented stub conventions. They fire on real runtime classes whose
    # __aenter__/__eq__ are correct and deliberately annotated more precisely than
    # `self`, and following them would weaken the annotations.
    "PYI034",
    "PYI036",
    # SQLAlchemy declarative classes legitimately carry mutable class attributes
    # (`metadata`, `type_annotation_map`, `__table_args__`); ClassVar-ing them breaks
    # the declarative API.
    "RUF012",
    # PEP 695 type-parameter syntax. Deferred deliberately: the project targets 3.12+
    # but several tools in the chain still parse the pre-695 form more reliably.
    "UP046",
    "UP047",
    "UP040",
    # Exception names are frozen by docs/CONTRACTS.md §10 (`TokenBudgetExceeded`,
    # `LLMTimeout`, `LLMRateLimited`, `PromptNotFound`, …). They read better without the
    # suffix and renaming them would be a breaking contract change to satisfy a style rule.
    "N818",
    # Prose in docstrings and user-facing strings uses real typography — en dashes, curly
    # quotes, arrows. These rules exist to catch homoglyph attacks in *identifiers*, not to
    # force ASCII on English prose, and they fire ~50 times on deliberate punctuation.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files exist to re-export; unsorted __all__ blocks there are grouped
# by subsystem on purpose, which reads better than alphabetical.
"app/**/__init__.py" = ["RUF022"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["alembic/versions", "desktop"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers -q"
markers = [
    "integration: requires a real database, broker, or browser",
    "slow: takes more than a second",
]
